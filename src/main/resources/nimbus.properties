# Nimbus defaults. See PLAN.md, Appendix B.
# Override precedence, lowest to highest: this file < --config=<file> < environment
# (NIMBUS_CACHE_MAXBYTES) < -D system properties < --key=value CLI flags.

# --- Server ---
# Bind address.
nimbus.host=127.0.0.1
# 0 = a free port (tests).
nimbus.port=8080

# --- Upstreams ---
nimbus.forecast.upstream=https://api.open-meteo.com/v1/forecast
nimbus.geocoding.upstream=https://geocoding-api.open-meteo.com/v1/search

# --- Request limits ---
# Characters; over the limit gives 414.
nimbus.request.maxQueryLength=4096
# Over the limit gives 400.
nimbus.request.maxQueryParams=100

# --- Cache ---
# linkedhashmap (baseline) or custom (after Track 2).
nimbus.cache.impl=linkedhashmap
# Total weighted size: 64 MiB.
nimbus.cache.maxBytes=67108864
nimbus.cache.maxEntries=10000
# 512 KiB. Must be <= nimbus.cache.maxBytes and <= nimbus.upstream.maxResponseBytes.
nimbus.cache.maxEntryBytes=524288
# Upstream headers can only shorten the TTL.
nimbus.cache.forecast.ttlSeconds=300
# 0 disables stale-if-error for the route.
nimbus.cache.forecast.staleSeconds=3600
nimbus.cache.geocoding.ttlSeconds=86400
nimbus.cache.geocoding.staleSeconds=604800

# --- Per-client rate limiting ---
# Burst size.
nimbus.ratelimit.client.capacity=30
nimbus.ratelimit.client.refillPerSecond=10
nimbus.ratelimit.client.idleEvictSeconds=600

# --- Upstream protection (80% of the Open-Meteo free tier) ---
nimbus.upstream.perMinute=480
nimbus.upstream.perHour=4000
nimbus.upstream.perDay=8000
# After an upstream 429 (or the upstream Retry-After, if longer).
nimbus.upstream.cooldownSeconds=60
nimbus.upstream.connectTimeoutMs=3000
# Total deadline: headers + body.
nimbus.upstream.deadlineMs=5000
# Download abort threshold: 2 MiB.
nimbus.upstream.maxResponseBytes=2097152
# Concurrent upstream fetches.
nimbus.upstream.maxConcurrent=32
# Wait for a permit before giving up.
nimbus.upstream.permitWaitMs=1000

# --- Metrics ---
# Samples per latency recorder.
nimbus.metrics.latencyWindow=4096

# --- GUI ---
nimbus.gui.proxyUrl=http://127.0.0.1:8080
nimbus.gui.metricsRefreshMs=1000
